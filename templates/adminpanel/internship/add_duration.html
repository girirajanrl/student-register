<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add duration</title>

    {% include 'adminpanel/bootrapp_load.html' %}

    <style>

        body{
            background: linear-gradient(to right, #6971ba, #ccccd2);
        }

        .custom-card{
            border-radius:20px;
            overflow:hidden;
        }

        .custom-header{
            background-color:#292757;
        }

        .custom-btn{
            background-color:#17153c;
            color:white;
            border:none;
        }

        .custom-btn:hover{
            background-color:#272071;
            color:white;
        }

        .form-control{
            border-radius:10px;
            padding:10px;
        }

    </style>

</head>

<body class="sb-nav-fixed">

    <!-- Sidebar -->
    {% include 'adminpanel/admin_sidebar.html' %}

    <!-- Main Layout -->


        <!-- Content -->
        <div id="layoutSidenav_content">

            <main>

                <div class="container-fluid px-3 px-md-4 mt-4">

                    <!-- Heading -->
                    <div class="mb-4">

                        <h2 class="fw-bold text-dark">
                            Add Duration
                        </h2>

                    </div>

                    <!-- Row -->
                    <div class="row justify-content-center">

                        <!-- Column -->
                        <div class="col-12 col-md-8 col-lg-6">

                            <!-- Card -->
                            <div class="card shadow-lg border-0 custom-card">

                                <!-- Card Header -->
                                <div class="card-header custom-header text-white py-3">

                                    <h5 class="mb-0">
                                       Duration Form
                                    </h5>

                                </div>

                                <!-- Card Body -->
                                <div class="card-body p-4 bg-white">

                                    <form action="" method="POST">

                                        {% csrf_token %}

                                        <!-- Form -->
                                        <div class="mb-3">

                                            {{ form.as_p }}

                                        </div>

                                        <!-- Buttons -->
                                        <div class="d-flex flex-column flex-md-row gap-3">

                                            <button type="submit"
                                                    class="btn custom-btn px-4">

                                                Add Duration

                                            </button>


                                        </div>

                                    </form>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>

</body>

</html>
