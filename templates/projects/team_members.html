
<!DOCTYPE html>
<html>
<head>
    <title>Offline Payment</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>




<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-10">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Team Member Details</h2>
                </div>

                <div class="card-body">
<form method="POST">

    {% csrf_token %}

    {{ formset.management_form }}

    {% for form in formset %}

    <div class="card shadow-sm border-0 rounded-4 mb-4">

        <div class="card-body p-4">

            <h5 class="fw-bold text-primary mb-4">
                Team Member {{ forloop.counter }}
            </h5>

            <div class="row">

                <!-- Member Name -->
                <div class="col-md-4 mb-3">

                    <label class="form-label fw-semibold">
                        Member Name
                    </label>

                    {{ form.member_name }}

                </div>

                <!-- Contact -->
                <div class="col-md-4 mb-3">

                    <label class="form-label fw-semibold">
                        Contact Number
                    </label>

                    {{ form.member_contact }}

                </div>

                <!-- Email -->
                <div class="col-md-4 mb-3">

                    <label class="form-label fw-semibold">
                        Email Address
                    </label>

                    {{ form.member_email }}

                </div>

         

            </div>

        </div>

    </div>

    {% endfor %}

    <div class="text-end">

        <button type="submit"
                class="btn btn-primary px-5 py-2 rounded-3">

            Next Payment

        </button>

    </div>

</form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
